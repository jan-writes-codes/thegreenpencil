<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f5f2ea;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#243528;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f2ea;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fbf8f1;border:1px solid rgba(36,53,40,0.10);border-radius:18px;overflow:hidden;">
        <tr><td style="padding:24px 30px 0;">
          <span style="font-size:18px;font-weight:700;letter-spacing:-0.02em;">the green <span style="color:#309050;">pencil</span></span>
        </td></tr>
        <tr><td style="padding:18px 30px 4px;">
          <div style="display:inline-block;background:{% if tone == 'warn' %}rgba(194,85,47,0.12);color:#a23a22{% else %}rgba(58,165,92,0.12);color:#277a42{% endif %};font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:100px;">{{ badge }}</div>
          <h1 style="font-size:21px;line-height:1.2;letter-spacing:-0.02em;margin:14px 0 8px;">{{ heading }}</h1>
        </td></tr>
        <tr><td style="padding:8px 30px 4px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff;border:1px solid rgba(36,53,40,0.10);border-radius:14px;">
            <tr><td style="padding:14px 16px;border-bottom:1px solid rgba(36,53,40,0.07);"><span style="font-size:12px;color:#6e7d6e;">Termin</span><br><span style="font-size:15px;font-weight:600;">{{ when }}</span></td></tr>
            <tr><td style="padding:14px 16px;"><span style="font-size:12px;color:#6e7d6e;">{{ who_label }}</span><br><span style="font-size:15px;font-weight:600;">{{ who }}</span></td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:16px 30px 26px;">
          {% for line in body %}<p style="font-size:13.5px;line-height:1.6;color:#6e7d6e;margin:0 0 10px;">{{ line }}</p>{% endfor %}
          {% if cta_url %}<p style="margin:14px 0 0;"><a href="{{ cta_url }}" style="display:inline-block;background:#309050;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:11px;">{{ cta_label }}</a></p>{% endif %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
